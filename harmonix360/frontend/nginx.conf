# "upgrade" for a WebSocket handshake, "close" for everything else. Without
# this map, a plain request would carry `Connection: upgrade` and some upstreams
# reject it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phase 10 realtime (/api/v1/ws/{channel}). A WebSocket upgrade needs
        # HTTP/1.1 and the Upgrade/Connection headers passed through; nginx
        # defaults to HTTP/1.0 upstream and strips hop-by-hop headers, which
        # turns the handshake into a plain response and the socket never opens.
        # Harmless for the ordinary REST traffic on this same location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A WebSocket is idle between events by design. The default 60s read
        # timeout would drop every channel a minute after it connected.
        proxy_read_timeout 3600s;
    }
}
