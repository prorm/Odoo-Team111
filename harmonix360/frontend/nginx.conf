server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # The offline reachability probe (src/lib/reachability.ts) pings /health,
    # which sits OUTSIDE the /api/v1 prefix and so needs its own entry — the
    # same reason vite.config.ts carries a second proxy rule for it.
    #
    # Without this, `try_files` answered /health with index.html and a 200, so
    # `res.ok` was true and the app reported itself ONLINE with the backend
    # stopped. The offline banner then never appeared in the containerised
    # deployment, while working correctly under the dev server — the worst
    # shape of bug, since the thing you test on and the thing you ship differ.
    #
    # With the backend down nginx now answers 502, which is a falsy `res.ok`
    # and the honest answer.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
