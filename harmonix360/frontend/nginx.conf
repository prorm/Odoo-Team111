# "upgrade" for a WebSocket handshake, "close" for everything else. Without
# this map, a plain request would carry `Connection: upgrade` and some upstreams
# reject it.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # The offline reachability probe (src/lib/reachability.ts) pings /health,
    # which sits OUTSIDE the /api/v1 prefix and so needs its own entry — the
    # same reason vite.config.ts carries a second proxy rule for it.
    #
    # Without this, `try_files` answered /health with index.html and a 200, so
    # `res.ok` was true and the app reported itself ONLINE with the backend
    # stopped. The offline banner then never appeared in the containerised
    # deployment, while working correctly under the dev server — the worst
    # shape of bug, since the thing you test on and the thing you ship differ.
    #
    # With the backend down nginx now answers 502, which is a falsy `res.ok`
    # and the honest answer.
    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Phase 10 realtime (/api/v1/ws/{channel}). A WebSocket upgrade needs
        # HTTP/1.1 and the Upgrade/Connection headers passed through; nginx
        # defaults to HTTP/1.0 upstream and strips hop-by-hop headers, which
        # turns the handshake into a plain response and the socket never opens.
        # Harmless for the ordinary REST traffic on this same location.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A WebSocket is idle between events by design. The default 60s read
        # timeout would drop every channel a minute after it connected.
        proxy_read_timeout 3600s;
    }
}
